<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="{{{appclient}}}"></script>
    <link rel="stylesheet" href="../../styles/placeholder.css" />
    <title>Full Page</title>
  </head>
  <body class="full-page">
    <main class="full-page__main">
      <div class="placeholder placeholder--full">
        <p class="placeholder__label">full_page_app</p>
        <p class="placeholder__hint">App placeholder surface</p>
      </div>
    </main>
  </body>
  <script defer>
    (async function init() {
      var client;
      client = await app.initialized();
      client.events.on('app.activated', () => {
        console.log(`full_page placeholer :  app is activated 🥁`);
      });
    })();
  </script>
</html>
